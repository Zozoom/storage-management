services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting Docker Compose}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-0}
      CORS_ORIGINS: http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
