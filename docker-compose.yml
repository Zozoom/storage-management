services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}
      CORS_ORIGINS: http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
