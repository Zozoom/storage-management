services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random deployment-specific secret}
      APP_MODE: ${APP_MODE:-production}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CLERK_USERNAME: ${DEMO_CLERK_USERNAME:-}
      DEMO_CLERK_PASSWORD: ${DEMO_CLERK_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
